kind = "mobile"
previewPath = "/"
title = "Magic TV Remote"
description = "A mobile remote-control companion for the Magic 200 Pro TV box, with Wi-Fi control and guided setup for IR or Bluetooth where the device and phone support them."
version = "1.0.0"
id = "artifacts/magic-tv-remote"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 18159

[services.development]
run = "pnpm --filter @workspace/magic-tv-remote run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/magic-tv-remote", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/magic-tv-remote", "run", "serve" ]

[services.env]
PORT = "18159"
BASE_PATH = "/"
