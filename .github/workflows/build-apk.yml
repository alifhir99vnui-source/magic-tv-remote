name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Prebuild Android project
        run: CI=1 npx expo prebuild --platform android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build APK with Gradle
        run: |
          cd android
          build_ok=0
          for i in 1 2 3; do
            if ./gradlew assembleRelease --no-daemon --refresh-dependencies; then
              build_ok=1
              break
            fi
            echo "Gradle attempt $i failed, retrying..."
            sleep 5
          done
          if [ "$build_ok" -ne 1 ]; then
            echo "Gradle build failed after 3 attempts"
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: magic-tv-remote-apk
          path: android/app/build/outputs/apk/release/*.apk
